{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<h2>Select Folder</h2>

<style>
.folder-grid, .file-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}

.folder-card, .file-card {
    width: 180px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    text-align: center;
    cursor: pointer;
    background: #fafafa;
    transition: 0.2s;
}

.folder-card:hover, .file-card:hover {
    background: #e8f0ff;
}

.file-card.selected {
    border-color: #007bff;
    background-color: #e0f2ff;
}

#file-container {
    display: none;
    margin-top: 20px;
}

#save-selection-btn {
    display: none;          /* hidden initially */
    padding: 4px 12px;      /* small padding */
    font-size: 18px;
    border-radius: 4px;
    background-color: #007bff;
    color: #fff;
    border: none;
    cursor: pointer;
    width: 100px;
    margin-top: 22px;
    margin-left: 18px;
}

#save-selection-btn:hover {
    background-color: #0056b3;
}
</style>

<!-- Folders -->
<div id="folder-container" class="folder-grid">
    {% for folder in folders %}
        <div class="folder-card" data-folder="{{ folder.folder_name }}">
            📁<br>
            <strong>{{ folder.folder_name }}</strong><br>
            <small>{{ folder.file_count }} files</small>
        </div>
    {% empty %}
        <p>No folders found.</p>
    {% endfor %}
</div>

<!-- Files -->
<div id="file-container" class="file-grid"></div>

<button id="save-selection-btn">Save</button>

<script>
// Track single selected file
let selectedFileId = null;

// Click folder to load files
document.querySelectorAll(".folder-card").forEach(card => {
    card.addEventListener("click", function () {
        const folderName = this.dataset.folder;

        fetch(`/sop/mediabucket/select/files_ajax/?folder_name=${encodeURIComponent(folderName)}`)
            .then(response => response.json())
            .then(data => {
                const fileContainer = document.getElementById("file-container");
                fileContainer.innerHTML = ""; 
                selectedFileId = null; // reset

                data.files.forEach(file => {
                    const div = document.createElement("div");
                    div.classList.add("file-card");
                    div.dataset.fileId = file.id;
                    div.innerHTML = `<div>${file.filename}</div>`;
                    fileContainer.appendChild(div);

                    // Click on file card to select
                    div.addEventListener("click", function () {
                        // Deselect previous
                        fileContainer.querySelectorAll(".file-card").forEach(c => c.classList.remove("selected"));
                        // Select current
                        this.classList.add("selected");
                        selectedFileId = this.dataset.fileId;
                    });
                });

                fileContainer.style.display = "flex";
                document.getElementById("save-selection-btn").style.display = "inline-block";
            });
    });
});

// Save Selection button
document.getElementById("save-selection-btn").addEventListener("click", function () {
    if (!selectedFileId) {
        alert("Please select a file first!");
        return;
    }
    if (!window.parent || !window.parent.setSelectedMediaFiles) return;

    window.parent.setSelectedMediaFiles([selectedFileId]);
});
</script>
{% endblock %}
