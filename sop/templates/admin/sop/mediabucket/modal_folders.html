{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Select Media Files</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .folder-grid { display:flex; flex-wrap:wrap; gap:16px; }
        .folder-card {
            width:150px; height:100px;
            border:1px solid #ccc; border-radius:6px;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; text-align:center;
            background:#f9f9f9; transition:0.2s;
        }
        .folder-card:hover { background:#e0f7fa; border-color:#00acc1; }

        #files-container { margin-top:20px; }
        .files-grid { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; }

        .file-card {
            padding:8px; border:1px solid #ccc;
            cursor:pointer; border-radius:4px;
            background:#f9f9f9; text-align:center;
        }
        .file-card.selected { background:#b2ebf2; border-color:#00acc1; }

        #save-files-btn { margin-top:12px; padding:6px 12px; cursor:pointer; }
    </style>
</head>
<body>

<h2>Select a Folder</h2>

{% if folders %}
<div class="folder-grid">
    {% for folder in folders %}
    <div class="folder-card" data-folder="{{ folder.folder_name }}">
        {{ folder.folder_name }}<br>({{ folder.file_count }} files)
    </div>
    {% endfor %}
</div>
{% else %}
<p>No folders found.</p>
{% endif %}

<div id="files-container"></div>

<script>
document.querySelectorAll('.folder-card').forEach(function (card) {

    card.addEventListener('click', function () {
        var folderName = card.dataset.folder;

        var xhr = new XMLHttpRequest();
        xhr.open(
            'GET',
            `/admin/sop/productionline/mediabucket/files/?folder_name=${encodeURIComponent(folderName)}`
        );

        xhr.onload = function () {
            if (xhr.status === 200) {

                document.getElementById('files-container').innerHTML = xhr.responseText;

                // Toggle file selection
                document.querySelectorAll('.file-card').forEach(function (fileCard) {
                    fileCard.addEventListener('click', function () {
                        fileCard.classList.toggle('selected');
                    });
                });

                // Save selection
                var saveBtn = document.getElementById('save-files-btn');
                if (saveBtn) {
                    saveBtn.addEventListener('click', function () {

                        console.log("Save Selection clicked ✅");

                        var selectedIds = Array.from(
                            document.querySelectorAll('.file-card.selected')
                        ).map(el => el.dataset.fileId);

                        console.log("🔵 Selected MediaBucket file IDs:", selectedIds);

                        /*
                        var row = window.parent._activeInlineRow;
                        if (!row) {
                            alert("Inline row not found");
                            return;
                        }

                        var $row = window.parent.django.jQuery(row);

                        console.log("🟣 Target inline row:", row);

                        // Hidden input
                        var input = $row.find('input[name$="selected_files_ids"]');
                        if (!input.length) {
                            input = window.parent.django.jQuery('<input>', {
                                type: 'hidden',
                                name: $row.find('select[name$="display_tv"]')
                                          .attr('name')
                                          .replace('display_tv', 'selected_files_ids')
                            }).appendTo($row);
                        }

                        input.val(selectedIds.join(',')); 

                        */

                        var row = window.parent._activeInlineRow;
                        var $row = window.parent.django.jQuery(row);

                        // 🔑 THIS IS THE KEY LINE
                        var prefix = $row.find('input, select, textarea').first().attr('name').split('-').slice(0, 2).join('-');

                        var input = $row.find('input[name$="selected_files_ids"]');

                        if (!input.length) {
                            input = window.parent.django.jQuery('<input>', {
                                type: 'hidden',
                                name: prefix + '-selected_files_ids'
                            }).appendTo($row);
                        }

                        input.val(selectedIds.join(','));

                        console.log("✅ Stored value in hidden input:", input.val());

                        // Replace button text
                        $row.find('.select-files-btn')
                            .closest('td')
                            .html(selectedIds.length + ' file(s) selected');

                        // Close modal
                        window.parent.document.getElementById('media-bucket-modal').style.display = 'none';
                        window.parent.document.getElementById('media-bucket-iframe').src = '';
                    });
                }
            }
        };

        xhr.send(); // ✅ REQUIRED
    });

});
</script>

</body>
</html>
