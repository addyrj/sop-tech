{% load static %}


<style>
    .paginator { display: none; }
</style>

<tbody>
    <tr>
        <td colspan="100%">
            <div style="display:flex; flex-wrap: wrap; gap:20px; margin-top:10px;">
                {% for folder in cl.folders %}
                <div style="width:160px; text-align:center; border-radius:10px; overflow:hidden;
                            transition: transform 0.2s; cursor:pointer;"
                     onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                    <a href="{% url 'admin:mediafolder_detail' folder_name=folder %}" style="text-decoration:none; color:inherit;">
                        <div style="background:#f5f5f5; padding:20px; border-radius:10px;">
                            <img src="{% static 'images/icon-folder.svg' %}" alt="{{ folder }}" 
                                 style="width:70px; height:70px;">
                        </div>
                        <div style="margin-top:8px; font-weight:bold; word-break: break-word;">{{ folder }}</div>
                    </a>
                </div>
                {% empty %}
                <p>No media buckets found.</p>
                {% endfor %}
            </div>
        </td>
    </tr>
</tbody>
